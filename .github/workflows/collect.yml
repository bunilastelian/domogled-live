name: publicare dashboard Domogled

# Acest workflow NU mai colecteaza date.
#
# Colectarea ruleaza nonstop pe masina locala (systemd: domogled-collector),
# care scrie starea si o publica prin `deploy/publish.sh` la fiecare ~5 minute.
#
# Motivul: cron-ul GitHub (`schedule:`) s-a dovedit nefiabil aici — 7 rulari,
# toate `workflow_dispatch`, zero `schedule`, adica monitorul statea 3+ ore
# fara date noi fara ca nimeni sa observe.
#
# Acest workflow face UN SINGUR lucru: publica `live/web/` pe GitHub Pages.
# Porneste la push pe fisierele de stare (deci la fiecare publicare locala)
# sau manual din tab-ul Actions.

on:
  push:
    branches: [main]
    paths:
      - 'live/web/state/state.json'
      - 'live/web/img/**'
      - 'live/web/*.geojson'
      - '.github/workflows/collect.yml'
  workflow_dispatch:        # pornire manuala din tab-ul Actions

permissions:
  contents: read            # doar citeste — nu mai comite nimic
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Pregateste artefactul pentru Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: live/web        # doar dashboard-ul devine radacina site-ului

      - id: deployment
        uses: actions/deploy-pages@v5
